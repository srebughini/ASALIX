name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install dependencies
        # Importing asalix also imports its plotting module.
        run: python -m pip install -r requirements.txt pytest matplotlib
      - name: Run pytest
        run: python -m pytest -q
      - name: Run the existing test runner
        run: python run_tests.py
